name: Niricson Software
description: >-
  Niricson Software Inc. is an infrastructure technology company making concrete
  infrastructure safer through AI-powered digital condition assessment. Its
  patented AUTOSPEX platform uses machine learning and multi-sensor data fusion
  (visual, thermal, and acoustic) to automatically detect, quantify, and track
  defects such as cracks, spalling, delamination, and alkali-aggregate reaction
  in dams, spillways, bridges, and airfields. Data is collected with its DRONIC
  architecture and NCX acoustic drone payload, which simulates the traditional
  concrete hammer-sounding test to identify subsurface delamination up to eight
  inches deep. Asset owners and civil engineers access results through the
  login-gated, web-based AUTOSPEX platform to interact with defect maps and
  compare surveys over time. Niricson operates across the USA, Canada, Australia,
  and India, and is a Techstars portfolio company. It exposes no public API,
  developer portal, or SDK at this time.
